<section class="work" id="work" data-i18n-label="rail.work" data-thread="scroll">
    <div class="station work-stage" data-thread-layer>
        <h2 class="station-title" data-i18n="rail.work" data-thread-axis></h2>

        <ol class="work-signs" data-thread-shelf>
            <li class="work-sign" data-thread-stop>
                <div class="sign-plate">
                    <p class="sign-route"><span><b>GET</b> /<span data-i18n="work.one.slug"></span></span></p>
                    <p class="sign-meta"><span data-i18n="work.one.role"></span><span class="sign-years" data-i18n="work.one.years"></span></p>
                    <p class="sign-did" data-i18n="work.one.did"></p>
                </div>
            </li>
            <li class="work-sign" data-thread-stop>
                <div class="sign-plate">
                    <p class="sign-route"><span><b>GET</b> /<span data-i18n="work.two.slug"></span></span></p>
                    <p class="sign-meta"><span data-i18n="work.two.role"></span><span class="sign-years" data-i18n="work.two.years"></span></p>
                    <p class="sign-did" data-i18n="work.two.did"></p>
                </div>
            </li>
            <li class="work-sign" data-thread-stop>
                <div class="sign-plate">
                    <p class="sign-route"><span><b>GET</b> /<span data-i18n="work.three.slug"></span></span></p>
                    <p class="sign-meta"><span data-i18n="work.three.role"></span><span class="sign-years" data-i18n="work.three.years"></span></p>
                    <p class="sign-did" data-i18n="work.three.did"></p>
                </div>
            </li>
        </ol>

        <div class="work-finish">
            <div class="board work-board" data-thread-board="2">
                <svg class="board-art" viewBox="0 0 120 120" aria-hidden="true">
                    <defs>
                        <clipPath id="work-placed"><path class="board-cut"></path></clipPath>
                        <clipPath id="work-cut"><path class="board-cut"></path></clipPath>
                        <clipPath id="work-bands">
                            <rect class="board-band"></rect>
                            <rect class="board-band"></rect>
                            <rect class="board-band"></rect>
                        </clipPath>
                    </defs>
                    <path class="board-ghost"></path>
                    <g class="board-placed">
                        <g clip-path="url(#work-placed)">
                            <rect class="board-base" width="120" height="120"></rect>
                            <image href="assets/img/portrait.webp" x="10" y="10" width="100" height="100"></image>
                        </g>
                        <path class="board-line"></path>
                    </g>
                    <g class="board-piece">
                        <g clip-path="url(#work-cut)">
                            <rect class="board-base" width="120" height="120"></rect>
                            <image href="assets/img/portrait.webp" x="10" y="10" width="100" height="100" clip-path="url(#work-bands)"></image>
                        </g>
                        <path class="board-line"></path>
                    </g>
                </svg>
                <span class="board-label" data-i18n="rail.filters"></span>
            </div>
        </div>
    </div>
</section>
