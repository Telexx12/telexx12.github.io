<section class="studies" id="studies" data-i18n-label="rail.studies" data-thread="intro">
    <div class="studies-stage">
        <div class="browser">
            <div class="browser-bar" aria-hidden="true">
                <i></i>
                <i></i>
                <i></i>
                <span class="browser-address" data-i18n="home.host"></span>
                <span class="browser-loading"></span>
            </div>

            <div class="browser-page" data-thread-layer>
                <h2 class="station-title" data-i18n="rail.studies" data-thread-start data-thread-axis></h2>

                <ol class="pages" data-thread-shelf>
                    <li class="page">
                        <div class="page-sheet" data-thread-stop>
                            <span class="page-line page-head"><span class="page-stage" data-i18n="studies.real.stage"></span><span class="page-date" data-i18n="studies.real.years"></span></span>
                            <span class="page-line page-school" data-i18n="studies.real.school"></span>
                            <ul class="page-notes">
                                <li class="page-line page-note" data-i18n="studies.real.learned1"></li>
                                <li class="page-line page-note" data-i18n="studies.real.learned2"></li>
                                <li class="page-line page-note" data-i18n="studies.real.learned3"></li>
                            </ul>
                        </div>
                    </li>
                    <li class="page">
                        <div class="page-sheet" data-thread-stop>
                            <span class="page-line page-head"><span class="page-stage" data-i18n="studies.higher.stage"></span><span class="page-date" data-i18n="studies.higher.years"></span></span>
                            <span class="page-line page-school" data-i18n="studies.higher.school"></span>
                            <ul class="page-notes">
                                <li class="page-line page-note" data-i18n="studies.higher.learned1"></li>
                                <li class="page-line page-note" data-i18n="studies.higher.learned2"></li>
                                <li class="page-line page-note" data-i18n="studies.higher.learned3"></li>
                                <li class="page-line page-note" data-i18n="studies.higher.learned4"></li>
                            </ul>
                        </div>
                    </li>
                    <li class="page">
                        <div class="page-sheet" data-thread-stop>
                            <span class="page-line page-head"><span class="page-stage" data-i18n="studies.laracasts.stage"></span><span class="page-date" data-i18n="studies.laracasts.years"></span></span>
                            <span class="page-line page-school" data-i18n="studies.laracasts.school"></span>
                            <ul class="page-notes">
                                <li class="page-line page-note" data-i18n="studies.laracasts.learned1"></li>
                                <li class="page-line page-note" data-i18n="studies.laracasts.learned2"></li>
                                <li class="page-line page-note" data-i18n="studies.laracasts.learned3"></li>
                            </ul>
                        </div>
                    </li>
                </ol>

                <div class="board studies-board" data-thread-board="1">
                    <svg class="board-art" viewBox="0 0 120 120" aria-hidden="true">
                        <defs>
                            <clipPath id="studies-placed"><path class="board-cut"></path></clipPath>
                            <clipPath id="studies-cut"><path class="board-cut"></path></clipPath>
                            <clipPath id="studies-bands">
                                <rect class="board-band"></rect>
                                <rect class="board-band"></rect>
                                <rect class="board-band"></rect>
                            </clipPath>
                        </defs>
                        <path class="board-ghost"></path>
                        <g class="board-placed">
                            <g clip-path="url(#studies-placed)">
                                <rect class="board-base" width="120" height="120"></rect>
                                <image href="assets/img/portrait.webp" x="10" y="10" width="100" height="100"></image>
                            </g>
                            <path class="board-line"></path>
                        </g>
                        <g class="board-piece">
                            <g clip-path="url(#studies-cut)">
                                <rect class="board-base" width="120" height="120"></rect>
                                <image href="assets/img/portrait.webp" x="10" y="10" width="100" height="100" clip-path="url(#studies-bands)"></image>
                            </g>
                            <path class="board-line"></path>
                        </g>
                    </svg>
                    <span class="board-label" data-i18n="rail.work"></span>
                    <span class="board-label" data-i18n="rail.filters"></span>
                </div>
            </div>
        </div>
    </div>
</section>
