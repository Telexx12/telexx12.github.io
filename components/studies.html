<section class="studies" id="studies" data-i18n-label="rail.studies">
    <div class="studies-stage" data-state="loading">
        <div class="browser">
            <div class="browser-bar" aria-hidden="true">
                <i></i>
                <i></i>
                <i></i>
                <span class="browser-address" data-i18n="home.host"></span>
                <span class="browser-loading"></span>
            </div>

            <div class="browser-page">
                <h2 class="studies-title" data-i18n="rail.studies"></h2>

                <div class="studies-loader">
                    <svg class="studies-ring" viewBox="0 0 120 120" aria-hidden="true">
                        <g data-state="idle" style="--i: 0"><circle class="ring-slot" cx="60" cy="60" r="56" pathLength="360"></circle><circle class="ring-fill" cx="60" cy="60" r="56" pathLength="360"></circle></g>
                        <g data-state="idle" style="--i: 1"><circle class="ring-slot" cx="60" cy="60" r="56" pathLength="360"></circle><circle class="ring-fill" cx="60" cy="60" r="56" pathLength="360"></circle></g>
                        <g data-state="idle" style="--i: 2"><circle class="ring-slot" cx="60" cy="60" r="56" pathLength="360"></circle><circle class="ring-fill" cx="60" cy="60" r="56" pathLength="360"></circle></g>
                    </svg>
                    <div class="studies-face">
                        <img src="assets/img/portrait-placeholder.svg" alt="">
                    </div>
                </div>

                <div class="studies-status">
                    <p class="studies-loading"><span data-i18n="studies.loading"></span> <b class="studies-count">0</b>/3</p>
                    <p class="studies-done"><span data-i18n="studies.done"></span><span class="studies-dot">.</span></p>
                </div>

                <ol class="services">
                    <li class="service" data-state="idle">
                        <div class="service-card">
                            <div class="service-head">
                                <span class="service-name">CoreService</span>
                                <span class="service-state"><span data-when="registered">register()</span><span data-when="booting">boot()</span><span data-when="booted" data-i18n="studies.booted"></span></span>
                            </div>
                            <span class="service-line service-stage" data-i18n="studies.core.stage"></span>
                            <span class="service-line service-meta"><span data-i18n="studies.core.school"></span> · <span data-i18n="studies.core.years"></span></span>
                            <span class="service-line service-bind"><span class="service-key">bind</span> <span data-i18n="studies.core.learned"></span></span>
                        </div>
                    </li>
                    <li class="service" data-state="idle">
                        <div class="service-card">
                            <div class="service-head">
                                <span class="service-name">RealPerspectiveService</span>
                                <span class="service-state"><span data-when="registered">register()</span><span data-when="booting">boot()</span><span data-when="booted" data-i18n="studies.booted"></span></span>
                            </div>
                            <span class="service-line service-stage" data-i18n="studies.real.stage"></span>
                            <span class="service-line service-meta"><span data-i18n="studies.real.school"></span> · <span data-i18n="studies.real.years"></span></span>
                            <span class="service-line service-bind"><span class="service-key">bind</span> <span data-i18n="studies.real.learned"></span></span>
                        </div>
                    </li>
                    <li class="service" data-state="idle">
                        <div class="service-card">
                            <div class="service-head">
                                <span class="service-name">FelsőoktatásService</span>
                                <span class="service-state"><span data-when="registered">register()</span><span data-when="booting">boot()</span><span data-when="booted" data-i18n="studies.booted"></span></span>
                            </div>
                            <span class="service-line service-stage" data-i18n="studies.higher.stage"></span>
                            <span class="service-line service-meta"><span data-i18n="studies.higher.school"></span> · <span data-i18n="studies.higher.years"></span></span>
                            <span class="service-line service-bind"><span class="service-key">bind</span> <span data-i18n="studies.higher.learned"></span></span>
                        </div>
                    </li>
                </ol>
            </div>
        </div>
    </div>
</section>
