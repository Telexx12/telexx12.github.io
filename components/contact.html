<section class="screen contact" id="contact" data-i18n-label="menu.contact" tabindex="-1">
    <div class="contact-stage">
        <div class="contact-head">
            <p class="screen-eyebrow" data-i18n="menu.contact"></p>
            <h2 class="screen-title"><span data-i18n="contact.title"></span><span class="screen-dot">.</span></h2>
            <p class="contact-lead" data-i18n="contact.lead"></p>
            <p class="contact-links"><span data-i18n="contact.elsewhere"></span> <a href="https://github.com/Telexx12" target="_blank" rel="noopener">GitHub</a> · <a href="https://www.linkedin.com/in/telegdi-d%C3%A1vid-4b29a428a" target="_blank" rel="noopener">LinkedIn</a></p>
        </div>
        <div class="contact-desk">
            <div class="envelope-flap" aria-hidden="true"><i></i></div>
            <form class="letter" method="post" novalidate data-endpoint="https://formspree.io/f/mljjjjoj" data-sitekey="">
                <input type="hidden" name="_subject" value="Új üzenet a weboldalról">
                <p class="letter-hi" data-i18n="contact.hi"></p>
                <div class="letter-line">
                    <label for="letter-name" data-i18n="contact.name"></label>
                    <span class="letter-blank"><input id="letter-name" name="name" required autocomplete="name" autocapitalize="words" spellcheck="false" enterkeyhint="next" aria-describedby="letter-name-error" data-i18n-placeholder="contact.name.hint"></span>
                    <p class="letter-error" id="letter-name-error" aria-live="polite"></p>
                </div>
                <div class="letter-line">
                    <label for="letter-email" data-i18n="contact.email"></label>
                    <span class="letter-blank"><input id="letter-email" name="email" type="email" required autocomplete="email" autocapitalize="none" spellcheck="false" enterkeyhint="next" aria-describedby="letter-email-error" data-i18n-placeholder="contact.email.hint"></span>
                    <p class="letter-error" id="letter-email-error" aria-live="polite"></p>
                </div>
                <div class="letter-paper" data-paper data-value="">
                    <label class="letter-hidden" for="letter-message" data-i18n="contact.message"></label>
                    <textarea id="letter-message" name="message" rows="1" required aria-describedby="letter-message-error" data-i18n-placeholder="contact.message.hint"></textarea>
                </div>
                <p class="letter-error" id="letter-message-error" aria-live="polite"></p>
                <p class="letter-bye"><span data-i18n="contact.bye"></span><br><span class="letter-sign" data-sign>…</span></p>
                <div class="letter-trap" aria-hidden="true"><label for="letter-gotcha">Website</label><input id="letter-gotcha" name="_gotcha" tabindex="-1" autocomplete="off"></div>
                <div class="letter-guard" data-guard></div>
                <button class="letter-send" type="submit"><span class="letter-send-text" data-i18n="contact.send"></span><span class="letter-send-busy" data-i18n="contact.sending"></span><i aria-hidden="true"></i></button>
                <p class="letter-hidden" role="status" data-busy></p>
                <p class="letter-status" role="status" data-status></p>
            </form>
            <svg class="envelope" viewBox="0 0 240 160" aria-hidden="true"><rect class="envelope-body" x="2" y="2" width="236" height="156" rx="10"></rect><path class="envelope-fold" d="M4 152 L120 78 L236 152"></path></svg>
            <div class="letter-sent" data-sent hidden tabindex="-1">
                <p class="letter-sent-title"><span data-i18n="contact.sent.title"></span><span class="screen-dot">!</span></p>
                <p class="letter-sent-text" data-i18n="contact.sent.text"></p>
                <button class="letter-again" type="button" data-again data-i18n="contact.again"></button>
            </div>
        </div>
    </div>
</section>
