<div class="boot-story">
    <div data-component="home"></div>

    <main class="boot-sections">
        <div data-component="studies"></div>
        <div data-component="cv"></div>
        <div data-component="work"></div>
        <div data-component="blog"></div>
        <div data-component="tldr"></div>
    </main>

    <nav class="boot-rail" data-i18n-label="rail.label">
        <button type="button" class="rail-theme" data-action="theme" data-i18n-label="rail.theme"><span></span></button>
        <button type="button" class="rail-lang" data-action="lang" data-i18n-label="rail.lang"></button>

        <div class="rail-track">
            <div class="rail-line"><div class="rail-fill"></div></div>
            <button type="button" class="rail-node" data-i18n-label="rail.studies" style="--icon: url('https://unpkg.com/heroicons@2.1.5/20/solid/academic-cap.svg')"><span><span class="rail-icon"></span></span></button>
            <button type="button" class="rail-node" data-i18n-label="rail.cv" style="--icon: url('https://unpkg.com/heroicons@2.1.5/20/solid/document-text.svg')"><span><span class="rail-icon"></span></span></button>
            <button type="button" class="rail-node" data-i18n-label="rail.work" style="--icon: url('https://unpkg.com/heroicons@2.1.5/20/solid/briefcase.svg')"><span><span class="rail-icon"></span></span></button>
            <button type="button" class="rail-node" data-i18n-label="rail.blog" style="--icon: url('https://unpkg.com/heroicons@2.1.5/20/solid/pencil.svg')"><span><span class="rail-icon"></span></span></button>
            <button type="button" class="rail-node" data-i18n-label="rail.tldr" style="--icon: url('https://unpkg.com/heroicons@2.1.5/20/solid/bolt.svg')"><span><span class="rail-icon"></span></span></button>
        </div>
    </nav>
</div>
